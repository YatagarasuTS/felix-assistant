<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Феликс</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { width: 100%; height: 100%; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.home #gl { filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 40%, transparent)); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bubble { position: absolute; max-width: 300px; padding: 12px 15px 13px; border-radius: 16px; pointer-events: auto; box-sizing: border-box;
    background: linear-gradient(180deg, color-mix(in srgb, var(--panel-solid) 92%, transparent), color-mix(in srgb, var(--bg) 88%, transparent));
    border: 1.5px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent);
    opacity: 0; transform: translateY(8px) scale(.96); transition: opacity .25s, transform .25s; transform-origin: var(--tail, 50%) 100%; }
  .bubble.show { opacity: 1; transform: none; }
  .bubble::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -11px; width: 18px; height: 18px; border-right: 1.5px solid var(--accent); border-bottom: 1.5px solid var(--accent); transform: rotate(45deg); background: color-mix(in srgb, var(--bg) 92%, transparent); }
  .bubble .scroll { max-height: 150px; overflow: hidden; }
  .bubble .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent2); animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bubble b { display: block; font: 650 15px var(--display); margin-bottom: 3px; }
  .bubble span { color: var(--dim); font-size: 13.5px; }
  .bubble .wave { display: flex; gap: 3px; align-items: center; height: 18px; margin-top: 7px; }
  .bubble .wave i { width: 3px; border-radius: 2px; background: var(--accent2); height: 4px; transition: height .08s; }
  .bubble .think i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); margin-right: 4px; animation: th 1s infinite; }
  .bubble .think i:nth-child(2) { animation-delay: .15s; } .bubble .think i:nth-child(3) { animation-delay: .3s; }
  @keyframes th { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  #orb { position: absolute; width: 58px; height: 58px; border-radius: 50%; display: none; pointer-events: auto;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent2) 80%, white 10%), var(--accent) 45%, #06302b 100%);
    box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 0 12px rgba(0,0,0,.4); animation: pulse 2.6s ease-in-out infinite; }
  #orb svg { position: absolute; inset: 13px; width: 32px; height: 32px; fill: rgba(255,255,255,.92); stroke: none; }
  #orb .mic { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: #22c55e; border: 2px solid #111; }
  #orb .mic.off { background: #666; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .peek { position: absolute; width: 210px; padding: 10px 12px; border-radius: 12px; font-size: 12.5px; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .3s cubic-bezier(.3,1.5,.5,1); transform-origin: 0 100%; }
  .peek.show { opacity: 1; transform: none; }
  .peek .t { display: flex; align-items: center; gap: 7px; font-weight: 650; margin-bottom: 6px; } .peek .t .ico { color: var(--accent2); }
  .peek div.f { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark { position: absolute; font: 800 30px var(--display); color: var(--accent2); text-shadow: 0 0 10px var(--accent); pointer-events: none; animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
  .stars { position: absolute; width: 0; height: 0; pointer-events: none; animation: orbit 0.9s linear infinite; font-size: 0; }
  .stars::before, .stars::after { content: '✦'; position: absolute; font: 700 20px var(--display); color: #ffd54a; text-shadow: 0 0 8px #ffb300; }
  .stars::before { left: -38px; top: 2px; } .stars::after { left: 26px; top: -6px; }
  @keyframes orbit { from { transform: translate(8px, 34px) rotate(0) scaleY(.45); } to { transform: translate(8px, 34px) rotate(360deg) scaleY(.45); } }
  .zzz { position: absolute; font: 700 18px var(--display); color: var(--dim); pointer-events: none; animation: zz 3s linear infinite; }
  @keyframes zz { from { opacity: 0; transform: translate(0,0) scale(.6); } 20% { opacity: 1; } to { opacity: 0; transform: translate(30px,-60px) scale(1.3); } }
  #fallback { position: absolute; display: none; left: 0; right: 0; bottom: 30px; color: var(--dim); font-size: 12px; text-align: center; }
</style>
</head>
<body class="home">
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="bubble" class="bubble"><div class="scroll" id="bscroll"><b id="bt"></b><span id="bs"></span></div><div class="wave" id="wave" style="display:none"></div></div>
<div id="orb" title="Феликс (клик — показать)"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.2" r="3.6"/><circle cx="16.8" cy="12" r="3.6"/><circle cx="12" cy="16.8" r="3.6"/><circle cx="7.2" cy="12" r="3.6"/></svg><span class="mic" id="orbMic"></span></div>
<div id="fallback">Модель Феликса не найдена</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="assistant.js"></script>
</body>
</html>
